services:
    frontend:
        volumes:
            - stand-demo-node-modules:/radar/node_modules
            - stand-demo-nuxt:/radar/.nuxt
        ports: !override
            - '127.0.0.1:8080:8080'
            - '127.0.0.1:9229:9229'
        environment: &stand-demo-environment
            DATABASE_URL: mysql://root:localhost@db:3306/radar?schema=public
            DOMAIN: http://localhost:8080
            REDIS_HOST: redis
            REMOTE_DATA_URL: ''
            NAVIGRAPH_CLIENT_ID: ''
            NAVIGRAPH_CLIENT_SECRET: ''
            NAVIGRAPH_SERVER_ID: ''
            NAVIGRAPH_SERVER_SECRET: ''
            DISCORD_TOKEN: ''
            QUESTDB_HOST: ''
            QUESTDB_HTTP_URL: ''
            QUESTDB_CLIENT_CONF: ''
            QUESTDB_ENABLE_WRITE: 'false'
            VR_DEBUG: '1'
    worker:
        environment: *stand-demo-environment
        volumes:
            - stand-demo-node-modules:/radar/node_modules
            - stand-demo-nuxt:/radar/.nuxt

volumes:
    stand-demo-node-modules:
    stand-demo-nuxt:
