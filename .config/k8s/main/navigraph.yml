apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radar-navigraph-prod
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: do-block-storage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: navigraph
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: navigraph
  template:
    metadata:
      labels:
        app: navigraph
    spec:
      imagePullSecrets:
        - name: ghcr-login-secret
      nodeSelector:
        doks.digitalocean.com/node-pool: main
      containers:
        - name: navigraph
          image: ghcr.io/vatsim-radar/vatsim-radar/production
          imagePullPolicy: Always
          command: ["/radar/.config/navigraph-prod.sh"]
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: navigraph-data
              mountPath: /radar/app/data
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 15
            successThreshold: 1
            failureThreshold: 30
            timeoutSeconds: 15
      volumes:
        - name: navigraph-data
          persistentVolumeClaim:
            claimName: radar-navigraph-prod
---
apiVersion: v1
kind: Service
metadata:
  name: navigraph
spec:
  ports:
    - port: 3000
  selector:
    app: navigraph
