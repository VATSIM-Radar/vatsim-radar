name: Code check

on:
  pull_request:
    branches: [ main, next, next-test ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - uses: ./.github/actions/codecheck
